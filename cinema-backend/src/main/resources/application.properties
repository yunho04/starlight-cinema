spring.application.name=cinema-backend
server.port=8080

# MySQL
# DB_URL을 지정하지 않으면 로컬 movie_booking DB에 연결한다.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/movie_booking?allowPublicKeyRetrieval=true}

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 스키마는 DB팀 DDL이 기준이다. 절대 create/update로 바꾸지 말 것.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:true}

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# 로그인 토큰(JWT)
# JWT_SECRET은 32바이트 이상 임의 문자열. 비어 있으면 실행할 때마다 임시 키를 만들어 쓴다(재시작 시 재로그인 필요).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# 프론트 개발 서버 주소 (쉼표로 여러 개 지정 가능)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# DB에 포스터 컬럼이 없어서 프론트 public/posters/{movie_id}.svg 경로로 내려준다.
app.poster-url-pattern=${POSTER_URL_PATTERN:/posters/%d.svg}
